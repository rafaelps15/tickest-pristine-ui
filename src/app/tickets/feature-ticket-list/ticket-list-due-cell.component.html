@let due = display();
<div class="due" [class.due-warning]="due.tone === 'warning'" [class.due-danger]="due.tone === 'danger'">
  <span class="due-label"><i class="bx {{ due.icon }}" aria-hidden="true"></i>{{ due.label }}</span>
  @if (due.showDate) {
    <span class="due-date small">{{ due.datePrefix }} <span class="num">{{ dueAtUtc() | date:'dd/MM/yyyy HH:mm' }}</span></span>
  }
  <!-- Atrasado não é beco sem saída: leva ao chamado, onde a conversa com o setor já existe (mesma rota do título). -->
  @if (due.tone === 'danger') {
    <a [routerLink]="['/tickets', ticketId()]" class="due-nudge small tap-target" [attr.aria-label]="'Cobrar no chamado ' + ticketTitle()">Cobrar no chamado</a>
  }
</div>
