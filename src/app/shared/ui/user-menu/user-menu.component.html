<div class="dropdown">
  <button type="button" class="btn p-0 user-menu-toggle" aria-label="Menu do usuário" aria-expanded="false"
          data-bs-toggle="dropdown" appDropdownFixedPosition>
    <span class="avatar-initials" aria-hidden="true">{{ initials() }}</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    <!-- Quem está logado: só informação, não um segundo link pro perfil (o item "Meu Perfil" já é esse link). -->
    <li class="user-menu-header">
      <span class="avatar-initials" aria-hidden="true">{{ initials() }}</span>
      <div class="min-w-0">
        <span class="fw-semibold d-block text-truncate">{{ displayName() }}</span>
        <small class="text-muted d-block text-truncate">{{ sessionService.email() }}</small>
      </div>
    </li>
    <li><div class="dropdown-divider"></div></li>
    <li>
      <a class="dropdown-item" routerLink="/perfil">
        <i class="bx bx-user me-2" aria-hidden="true"></i>
        <span class="align-middle">Meu Perfil</span>
      </a>
    </li>
    <li><div class="dropdown-divider"></div></li>
    <li>
      <button type="button" class="dropdown-item" (click)="logout()">
        <i class="bx bx-power-off me-2" aria-hidden="true"></i>
        <span class="align-middle">Sair</span>
      </button>
    </li>
  </ul>
</div>
