<div class="layout-wrapper layout-content-navbar" [class.menu-open]="menuOpen()">
  <div class="layout-container">
    <!-- Menu (Sidebar) -->
    <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme" [attr.inert]="menuHidden() ? '' : null"
           [appFocusTrap]="pageBehindMenu()" (click)="onMenuClick($event)">
      <div class="app-brand demo d-flex justify-content-center" style="height: 120px; padding: 1rem 0;">
        <a routerLink="/dashboard" class="app-brand-link" style="text-decoration: none;">
          <span class="app-brand-logo demo d-flex align-items-center justify-content-center">
            <img src="/img/logo/logo.png" alt="Tickest" style="width: 100px; height: auto;" class="img-fluid">
          </span>
        </a>

        <button #menuCloser type="button" class="menu-toggle-btn btn btn-icon rounded-circle ms-auto d-xl-none"
                aria-label="Fechar menu" aria-controls="layout-menu" (click)="closeMenuAndRestoreFocus()">
          <i class="bx bx-chevron-left bx-sm" aria-hidden="true"></i>
        </button>
      </div>

      <div class="menu-inner-shadow"></div>

      <app-side-menu-nav [activeTicketsItem]="activeTicketsItem()" />
    </aside>
    <!-- / Menu -->

    <!-- Layout page -->
    <div class="layout-page" [attr.inert]="pageBehindMenu() ? '' : null">
      <!-- Navbar -->
      <nav class="layout-navbar container-xxl navbar navbar-expand-xl align-items-center" id="layout-navbar">
        <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
          <button #menuOpener type="button" class="menu-toggle-btn btn btn-icon rounded-circle"
                  aria-label="Abrir menu" aria-controls="layout-menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
            <i class="bx bx-menu bx-sm" aria-hidden="true"></i>
          </button>
        </div>

        <app-user-menu />
      </nav>
      <!-- / Navbar -->

      <!-- Content wrapper -->
      <div class="content-wrapper">
        <!-- Content -->
        <div #mainContent class="container-xxl flex-grow-1 container-p-y">
          <router-outlet></router-outlet>
        </div>
        <!-- / Content -->
        <div class="content-backdrop fade"></div>
      </div>
      <!-- Content wrapper -->
    </div>
    <!-- / Layout page -->
  </div>
  <!-- Overlay -->
  <div class="layout-overlay layout-menu-toggle" (click)="closeMenuAndRestoreFocus()"></div>
</div>
