<app-summary-card [loading]="loading()" [failed]="failed()">
  <div class="insights-section">
    <div class="d-flex gap-4">
      <div>
        <div class="insights-stat">{{ departments().length }}</div>
        <p class="text-muted small mb-0">{{ departments().length === 1 ? 'departamento' : 'departamentos' }}</p>
      </div>
      <div>
        <div class="insights-stat">{{ totalSectors() }}</div>
        <p class="text-muted small mb-0">{{ totalSectors() === 1 ? 'setor' : 'setores' }}</p>
      </div>
    </div>
  </div>

  <!-- Cada aviso é um filtro: mostra só os departamentos que pedem ação (clicar de novo volta a todos). -->
  @if (departmentsWithoutSectors() > 0) {
    <div class="insights-section">
      <button type="button" class="insights-filter small" [class.active]="activeIssue() === 'withoutSectors'"
              [attr.aria-pressed]="activeIssue() === 'withoutSectors'" (click)="toggle('withoutSectors')">
        <i class="bx bx-error-circle text-warning me-1" aria-hidden="true"></i>{{ departmentsWithoutSectors() }} {{ departmentsWithoutSectors() === 1 ? 'departamento sem nenhum setor' : 'departamentos sem nenhum setor' }} — não {{ departmentsWithoutSectors() === 1 ? 'aparece' : 'aparecem' }} na abertura de chamados.
      </button>
    </div>
  }

  @if (departmentsWithoutResponsible() > 0) {
    <div class="insights-section mb-0">
      <button type="button" class="insights-filter small" [class.active]="activeIssue() === 'withoutResponsible'"
              [attr.aria-pressed]="activeIssue() === 'withoutResponsible'" (click)="toggle('withoutResponsible')">
        <i class="bx bx-user-x me-1" aria-hidden="true"></i>{{ departmentsWithoutResponsible() }} {{ departmentsWithoutResponsible() === 1 ? 'departamento sem responsável definido' : 'departamentos sem responsável definido' }}.
      </button>
    </div>
  }
</app-summary-card>
